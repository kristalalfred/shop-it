<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop It</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <a href="/" class="brand">shop it</a>
    <nav aria-label="Lists">
      <button id="setup-toggle" type="button" aria-controls="setup" aria-expanded="false" hidden>Setup</button>
      <a id="new-list" class="button" hidden>New list ↗</a>
      <details id="saved-lists" class="menu" hidden>
        <summary>Saved lists</summary>
        <div class="menu-panel" id="history"></div>
      </details>
    </nav>
  </header>
  <main>
    <input id="token" type="hidden" value="{{.Token}}">
    <section id="setup" class="setup" aria-labelledby="setup-title" hidden>
      <h1 id="setup-title">From idea to basket.</h1>
      <ol class="steps">
        <li id="step-extension" class="step">
          <div class="step-head"><h2>Browser extension</h2><span id="extension-status" class="step-status" role="status"></span></div>
          <div id="extension-install" class="recipe"></div>
        </li>
        <li id="step-chatgpt" class="step">
          <div class="step-head"><h2>ChatGPT</h2><span id="chatgpt-status" class="step-status" role="status"></span></div>
          <a id="install" class="button">Add to ChatGPT ↗</a>
        </li>
        <li id="step-stores" class="step">
          <div class="step-head"><h2>Stores</h2><span id="stores-status" class="step-status" role="status"></span></div>
          <div id="stores" class="stores" role="group" aria-label="Stores"></div>
        </li>
      </ol>
      <a id="start" class="button primary">Make a list in ChatGPT ↗</a>
    </section>
    <div id="intro" class="intro" hidden>
      <h1 id="title"></h1>
      <p id="subtitle" class="muted"></p>
    </div>
    <div id="message" role="status" aria-live="polite"></div>
    <section id="review" class="review" aria-label="Review" hidden>
      <div id="shops" class="shops"><h3 id="shops-title">Choose a shop</h3><div id="baskets" class="baskets" role="group" aria-labelledby="shops-title"></div></div>
      <p id="missing" class="callout"></p>
      <div id="notes"></div>
      <label id="ack-wrap" class="check"><input type="checkbox" id="ack"><span id="ack-text">I’ve reviewed the assumptions.</span></label>
    </section>
    <aside id="list" class="list-panel" aria-label="Grocery list" hidden>
      <div class="list-head"><h2>Groceries</h2><span id="list-count" class="muted"></span></div>
      <div id="lines"></div>
    </aside>
    <section id="checkout" class="checkout" aria-label="Basket" hidden>
      <div class="total"><div><span>Subtotal</span><p id="estimate" class="muted"></p></div><strong id="total"></strong></div>
      <label id="over-wrap" class="check"><input type="checkbox" id="over"><span id="over-text">Accept the amount over budget.</span></label>
      <div class="actions"><button id="refresh" type="button">Refresh prices</button><span id="filled" class="filled" hidden></span><a id="review-store" class="button" target="_blank" rel="noopener noreferrer" hidden>Review at store ↗</a><button id="transfer" class="primary" type="button">Fill basket</button></div>
      <div id="receipt" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
