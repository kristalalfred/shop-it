name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Hurl
        env:
          HURL_VERSION: 8.0.1
        run: |
          curl --fail --location --output "$RUNNER_TEMP/hurl.tar.gz" "https://github.com/Orange-OpenSource/hurl/releases/download/$HURL_VERSION/hurl-$HURL_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$RUNNER_TEMP/hurl.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/hurl-$HURL_VERSION-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: hurlfmt --check tests/api/*.hurl
      - run: go vet ./...
      - run: node --check internal/backend/web/app.js
      - run: go build -o bin/ ./cmd/...
      - run: ./bin/test-harness
